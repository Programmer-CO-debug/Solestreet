<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact SoleStreet | Customer Support</title>

    <meta name="description"
          content="Contact SoleStreet for questions about shoes, products and customer support.">

    <meta name="robots"
          content="index, follow">

    <link rel="canonical"
          href="https://YOUR-RENDER-URL.onrender.com/contact.html">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header class="header">

    <div class="logo">

        <a href="index.html">
            SoleStreet
        </a>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Shop</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

        <a href="login.html">Login</a>

    </nav>

</header>


<main>

<section class="section contact-page">

    <div class="section-heading">

        <p class="eyebrow">
            GET IN TOUCH
        </p>

        <h1>
            Contact SoleStreet
        </h1>

        <p>
            Have a question about our products?
            Send us a message.
        </p>

    </div>


    <form
        class="contact-form"
        onsubmit="submitContact(event)">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            required
            placeholder="Your name">


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            required
            placeholder="Your email">


        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            rows="6"
            required
            placeholder="Your message"></textarea>


        <button
            type="submit"
            class="btn">

            Send Message

        </button>

    </form>

</section>

</main>


<footer>

    <div class="copyright">

        <p>
            © 2026 SoleStreet
        </p>

    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
