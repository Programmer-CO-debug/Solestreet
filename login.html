<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SoleStreet</title>

    <meta name="description"
          content="Login to your SoleStreet account.">

    <meta name="robots"
          content="noindex, nofollow">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header class="header">

    <div class="logo">

        <a href="index.html">
            SoleStreet
        </a>

    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Shop</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<main>

<section class="form-section">

    <div class="form-box">

        <p class="eyebrow">
            ACCOUNT
        </p>

        <h1>
            Login
        </h1>

        <form onsubmit="loginUser(event)">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                required
                placeholder="Enter your email">


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
                placeholder="Enter your password">


            <button
                type="submit"
                class="btn">

                Login

            </button>

        </form>

    </div>

</section>

</main>


<footer>

    <div class="copyright">

        <p>
            © 2026 SoleStreet
        </p>

    </div>

</footer>


<script src="js/script.js"></script>

</body>

</html>
